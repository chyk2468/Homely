<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img"><rect width="1200" height="390" rx="18" fill="#F1F5F9"/><text x="56" y="42" fill="#2563EB" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">SYSTEM FLOW / ANIMATED</text><text x="56" y="80" fill="#1E293B" font-family="Arial,sans-serif" font-size="26" font-weight="700">Homely</text><text x="56" y="108" fill="#64748B" font-family="Arial,sans-serif" font-size="14">A resident and staff workflow for tracking maintenance complaints.</text><line x1="56" y1="128" x2="1144" y2="128" stroke="#DCE4EE"/><path d="M 288 236 H 334" stroke="#64748B" stroke-width="1.8"/><path d="M 328 231 L 334 236 L 328 241" stroke="#64748B" fill="none"/><path d="M 576 236 H 622" stroke="#64748B" stroke-width="1.8"/><path d="M 616 231 L 622 236 L 616 241" stroke="#64748B" fill="none"/><path d="M 864 236 H 910" stroke="#64748B" stroke-width="1.8"/><path d="M 904 231 L 910 236 L 904 241" stroke="#64748B" fill="none"/><g><rect x="56" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#DCE4EE"/><rect x="56" y="154" width="224" height="5" rx="2.5" fill="#2563EB"/><text x="72" y="184" fill="#2563EB" font-family="Arial,sans-serif" font-size="10" font-weight="700">REPORT</text><text x="72" y="219" fill="#1E293B" font-family="Arial,sans-serif" font-size="15" font-weight="700">Create complaint</text><text x="72" y="248" fill="#64748B" font-family="Arial,sans-serif" font-size="11.5">Resident submits issue details.</text><circle cx="260" cy="179" r="4" fill="#2563EB"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle></g><g><rect x="344" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#DCE4EE"/><rect x="344" y="154" width="224" height="5" rx="2.5" fill="#0D9488"/><text x="360" y="184" fill="#0D9488" font-family="Arial,sans-serif" font-size="10" font-weight="700">API + ACCESS</text><text x="360" y="219" fill="#1E293B" font-family="Arial,sans-serif" font-size="15" font-weight="700">Validate request</text><text x="360" y="248" fill="#64748B" font-family="Arial,sans-serif" font-size="11.5">Check input and role permissions.</text><circle cx="548" cy="179" r="4" fill="#0D9488"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle></g><g><rect x="632" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#DCE4EE"/><rect x="632" y="154" width="224" height="5" rx="2.5" fill="#D97706"/><text x="648" y="184" fill="#D97706" font-family="Arial,sans-serif" font-size="10" font-weight="700">RECORD</text><text x="648" y="219" fill="#1E293B" font-family="Arial,sans-serif" font-size="15" font-weight="700">Track lifecycle</text><text x="648" y="248" fill="#64748B" font-family="Arial,sans-serif" font-size="11.5">Store status and complaint history.</text><circle cx="836" cy="179" r="4" fill="#D97706"><animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/></circle></g><g><rect x="920" y="154" width="224" height="164" rx="12" fill="#FFFFFF" stroke="#DCE4EE"/><rect x="920" y="154" width="224" height="5" rx="2.5" fill="#2563EB"/><text x="936" y="184" fill="#2563EB" font-family="Arial,sans-serif" font-size="10" font-weight="700">RESOLVE</text><text x="936" y="219" fill="#1E293B" font-family="Arial,sans-serif" font-size="15" font-weight="700">Staff + admin</text><text x="936" y="248" fill="#64748B" font-family="Arial,sans-serif" font-size="11.5">Assign, update, and close the complaint.</text><circle cx="1124" cy="179" r="4" fill="#2563EB"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle></g><circle r="4.5" fill="#0D9488"><animateMotion dur="7s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><circle r="3" fill="#D97706"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M 288 236 L 344 236 L 568 236 L 632 236 L 856 236 L 920 236"/></circle><text x="56" y="358" fill="#64748B" font-family="Arial,sans-serif" font-size="12">Animated SVG preview. Open architecture.html for interactive stage details.</text></svg>