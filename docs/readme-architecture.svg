<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Homely workflow</title><desc id="desc">The resident or staff UI calls a FastAPI service, which applies authentication and role checks, persists complaint changes, and tracks the lifecycle for staff and administrators.</desc><rect width="1200" height="400" rx="18" fill="#F1F5F9"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#2563EB">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#1E293B">Homely</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748B">Resident complaint to tracked resolution</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#DCE4EE"/><path d="M 300 237 L 330 237" stroke="#64748B" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#64748B" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#64748B" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#64748B" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#2563EB"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#2563EB">01 / REPORT</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1E293B">Complaint + evidence</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Resident opens a maintenance ticket.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#0D9488"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#0D9488">02 / API + ACCESS</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1E293B">FastAPI / RBAC</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Validate identity, role, and input.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#D97706"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#D97706">03 / RECORD</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1E293B">Database + lifecycle</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Store updates and complaint history.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#2563EB"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#2563EB">04 / RESOLVE</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1E293B">Staff + admin</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">Assign, track SLA, and close the ticket.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#2563EB">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#64748B">The deployed system handles resident and staff data; use only approved demo accounts for public testing.</text></svg>