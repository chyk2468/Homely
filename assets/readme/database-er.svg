<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Homely Schema Database ER Diagram</title>
  <desc id="svg-desc">Schema models and relationships</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0F1E2E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1E2E"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1B334D" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="48" y="46" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DATABASE ENTITY RELATIONSHIPS</text>
  <text x="48" y="70" fill="#F0F9FF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Homely Schema</text>
  <g filter="url(#glow)">
    <rect x="48" y="96" width="250" height="244" rx="10" fill="#0F1E2E" stroke="#1B334D" stroke-width="1.2"/>
    <rect x="48" y="96" width="250" height="32" rx="10" fill="#1B334D"/>
    <text x="62" y="117" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">User</text>
    <text x="62" y="150" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">id (PK, UUID)</text>
    <text x="62" y="174" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">email (String, Unique)</text>
    <text x="62" y="198" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">hashed_password (String)</text>
    <text x="62" y="222" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">full_name (String)</text>
    <text x="62" y="246" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">role (Enum: Admin/Resident/S</text>
    <text x="62" y="270" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">flat_number (String)</text>
    <text x="62" y="294" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">created_at (DateTime)</text>
  </g>
  <path d="M 300 206 L 320 206" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="300" cy="206" r="3" fill="#06B6D4"/>
  <circle cx="320" cy="206" r="3" fill="#3B82F6"/>
  <g filter="url(#glow)">
