    <text x="336" y="174" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">resident_id (FK -&gt; User)</text>
    <text x="336" y="198" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">assigned_to (FK -&gt; User)</text>
    <text x="336" y="222" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">title (String)</text>
