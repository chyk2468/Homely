    <text x="610" y="174" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">user_id (FK -&gt; User)</text>
    <text x="610" y="198" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">title (String)</text>
    <text x="610" y="222" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">message (Text)</text>
    <text x="610" y="246" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">is_read (Boolean)</text>
    <text x="610" y="270" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">created_at (DateTime)</text>
  </g>
  <path d="M 848 206 L 868 206" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="848" cy="206" r="3" fill="#06B6D4"/>
  <circle cx="868" cy="206" r="3" fill="#3B82F6"/>
  <g filter="url(#glow)">
    <rect x="870" y="96" width="250" height="244" rx="10" fill="#0F1E2E" stroke="#1B334D" stroke-width="1.2"/>
    <rect x="870" y="96" width="250" height="32" rx="10" fill="#1B334D"/>
    <text x="884" y="117" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">AdminAuditLog</text>
    <text x="884" y="150" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">id (PK, UUID)</text>
    <text x="884" y="174" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">admin_id (FK -&gt; User)</text>
    <text x="884" y="198" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">action (String)</text>
    <text x="884" y="222" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">target_type (String)</text>
    <text x="884" y="246" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">target_id (String)</text>
    <text x="884" y="270" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">timestamp (DateTime)</text>
