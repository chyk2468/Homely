    <text x="336" y="270" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">status (Enum: Open/In_Progre</text>
    <text x="336" y="294" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">priority (Enum)</text>
  </g>
  <path d="M 574 206 L 594 206" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="574" cy="206" r="3" fill="#06B6D4"/>
  <circle cx="594" cy="206" r="3" fill="#3B82F6"/>
  <g filter="url(#glow)">
    <rect x="596" y="96" width="250" height="244" rx="10" fill="#0F1E2E" stroke="#1B334D" stroke-width="1.2"/>
